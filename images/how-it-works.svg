<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"
  aria-label="How it works: a file goes into the board, where a RISC-V processor and my encryption hardware lock it; out comes a locked file with a tamper seal">
  <title>How it works</title>
  <rect width="860" height="300" rx="14" fill="#1a1a19"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="28" y="40" fill="#ffffff" font-size="20" font-weight="700">How it works</text>
    <rect x="28" y="66" width="190" height="180" rx="10" fill="none" stroke="#3a3a37" stroke-width="1.5"/>
    <text x="44" y="96" fill="#ffffff" font-size="16" font-weight="700" text-anchor="start">1. Your file</text>
    <text x="44" y="124" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">A picture, a message</text><text x="44" y="143" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">or any file up to 120 KB,</text><text x="44" y="162" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">sent over a USB cable</text>
    <line x1="222" y1="156" x2="254" y2="156" stroke="#c3c2b7" stroke-width="2"/><path d="M252,150 L262,156 L252,162 Z" fill="#c3c2b7"/>
    <rect x="266" y="66" width="330" height="180" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/>
    <text x="282" y="96" fill="#ffffff" font-size="16" font-weight="700" text-anchor="start">2. The board (FPGA chip)</text>
    <rect x="282" y="112" width="140" height="78" rx="8" fill="none" stroke="#3a3a37" stroke-width="1.5"/>
    <text x="352" y="140" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">RISC-V</text><text x="352" y="157" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">processor</text><text x="352" y="174" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">(the brain)</text>
    <rect x="440" y="112" width="140" height="78" rx="8" fill="none" stroke="#3987e5" stroke-width="1.5"/>
    <text x="510" y="140" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">Encryption</text><text x="510" y="157" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">hardware</text><text x="510" y="174" fill="#ffffff" font-size="13" font-weight="400" text-anchor="middle">I designed</text>
    <line x1="424" y1="151" x2="438" y2="151" stroke="#c3c2b7" stroke-width="2"/>
    <text x="282" y="214" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">New instructions let the processor hand</text><text x="282" y="231" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">the work to the encryption hardware.</text>
    <line x1="600" y1="156" x2="632" y2="156" stroke="#c3c2b7" stroke-width="2"/><path d="M630,150 L640,156 L630,162 Z" fill="#c3c2b7"/>
    <rect x="644" y="66" width="190" height="180" rx="10" fill="none" stroke="#3a3a37" stroke-width="1.5"/>
    <text x="660" y="96" fill="#ffffff" font-size="16" font-weight="700" text-anchor="start">3. Locked file</text>
    <text x="660" y="124" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">Unreadable without</text><text x="660" y="143" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">the key, plus a 16-byte</text><text x="660" y="162" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">seal: change 1 byte</text><text x="660" y="181" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">and it is rejected</text>
    <text x="28" y="278" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Algorithms: ChaCha20 (encryption), Poly1305 (seal), Keccak-256 (fingerprint). Standard: RFC 8439.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img"
  aria-label="Encrypting the same 110 KB picture: software only takes 4.61 seconds, with the hardware 0.064 seconds, 72 times faster">
  <title>Software 4.61 s vs hardware 0.064 s (72x faster)</title>
  <rect width="860" height="240" rx="14" fill="#1a1a19"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="28" y="42" fill="#ffffff" font-size="21" font-weight="700">Encrypting one picture (110 KB) on the board</text>
    <text x="28" y="66" fill="#c3c2b7" font-size="13">Same 12 MHz RISC-V processor, same file. The bars grow in real time.</text>
    <text x="28" y="110" fill="#ffffff" font-size="15" font-weight="600">Software only</text>
    <rect x="200" y="94" width="590.7" height="24" rx="4" fill="#d95926"><animate attributeName="width" values="0;590.7;590.7" keyTimes="0;0.6593;1" dur="7.0s" repeatCount="indefinite"/></rect>
    <text x="800.7" y="111" fill="#ffffff" font-size="15" font-weight="600" opacity="1">4.61 s<animate attributeName="opacity" values="0;1" keyTimes="0;0.6593" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/></text>
    <text x="28" y="148" fill="#ffffff" font-size="15" font-weight="600">With my hardware</text>
    <rect x="200" y="132" width="8.2" height="24" rx="4" fill="#3987e5"><animate attributeName="width" values="0;8.2;8.2" keyTimes="0;0.0091;1" dur="7.0s" repeatCount="indefinite"/></rect>
    <text x="218.2" y="149" fill="#ffffff" font-size="15" font-weight="600" opacity="1">0.064 s  &#183;  72x faster<animate attributeName="opacity" values="0;1" keyTimes="0;0.0091" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/></text>
    <line x1="200" y1="168" x2="814.4" y2="168" stroke="#3a3a37"/>
    <line x1="200.0" y1="168" x2="200.0" y2="174" stroke="#c3c2b7"/><text x="200.0" y="190" fill="#c3c2b7" font-size="12" text-anchor="middle">0 s</text><line x1="328.0" y1="168" x2="328.0" y2="174" stroke="#c3c2b7"/><text x="328.0" y="190" fill="#c3c2b7" font-size="12" text-anchor="middle">1 s</text><line x1="456.0" y1="168" x2="456.0" y2="174" stroke="#c3c2b7"/><text x="456.0" y="190" fill="#c3c2b7" font-size="12" text-anchor="middle">2 s</text><line x1="584.0" y1="168" x2="584.0" y2="174" stroke="#c3c2b7"/><text x="584.0" y="190" fill="#c3c2b7" font-size="12" text-anchor="middle">3 s</text><line x1="712.0" y1="168" x2="712.0" y2="174" stroke="#c3c2b7"/><text x="712.0" y="190" fill="#c3c2b7" font-size="12" text-anchor="middle">4 s</text>
    <text x="28" y="222" fill="#c3c2b7" font-size="12">ChaCha20-Poly1305 encryption with a tamper seal. Measured with the board's own microsecond counter.</text>
  </g>
</svg>

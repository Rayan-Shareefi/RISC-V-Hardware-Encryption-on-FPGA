  <text x="448" y="27" fill="#c3c2b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Tera Term - board output (115200 baud)</text>
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" style="white-space:pre"><text x="28" y="68" fill="#c3c2b7" font-weight="400" xml:space="preserve">Received "test_picture.bmp": 112374 bytes.</text><text x="28" y="87" fill="#c3c2b7" font-weight="400" xml:space="preserve">BMP picture: the 54-byte header stays in clear (protected by the tag),</text><text x="28" y="106" fill="#c3c2b7" font-weight="400" xml:space="preserve">the 112320 bytes of pixels are encrypted / decrypted.</text><text x="28" y="125" fill="#c3c2b7" font-weight="400" xml:space="preserve">ENCRYPTION FINISHED (key "my 32-byte secret key 4 ChaCha20", nonce "unique nonce")</text><text x="28" y="144" fill="#c3c2b7" font-weight="400" xml:space="preserve">Poly1305 tag (SW): 8e85402dda6dcdb2748d6acb37f54822</text><text x="28" y="163" fill="#c3c2b7" font-weight="400" xml:space="preserve">Poly1305 tag (HW): 8e85402dda6dcdb2748d6acb37f54822</text><text x="28" y="182" fill="#ffffff" font-weight="400" xml:space="preserve">Checks: ciphertext SW == HW PASS | tag SW == HW PASS</text><text x="28" y="201" fill="#c3c2b7" font-weight="400" xml:space="preserve">(software and hardware give exactly the same encrypted file, so one file is sent)</text><text x="28" y="220" fill="#c3c2b7" font-weight="400" xml:space="preserve">SUMMARY - ENCRYPTION, 112320 bytes encrypted + 54-byte header (AAD), one run, 12 MHz CPU (time = 1 us counter)</text><text x="28" y="239" fill="#c3c2b7" font-weight="400" xml:space="preserve">              ------- Software --------  ------- Hardware -------</text><text x="28" y="258" fill="#c3c2b7" font-weight="400" xml:space="preserve">                 total time      cycles     total time     cycles  Speedup</text><text x="28" y="277" fill="#c3c2b7" font-weight="400" xml:space="preserve">  ChaCha20      2949.302 ms    35391588      41.569 ms     498793    71.0x</text><text x="28" y="296" fill="#c3c2b7" font-weight="400" xml:space="preserve">  Poly1305      1665.676 ms    19988073      22.433 ms     269165    74.3x</text><text x="28" y="315" fill="#c3c2b7" font-weight="400" xml:space="preserve">  -----------------------------------------------------------------------</text><text x="28" y="334" fill="#ffffff" font-weight="700" xml:space="preserve">  TOTAL         4614.978 ms    55379661      64.002 ms     767958    72.1x</text><text x="28" y="353" fill="#ffffff" font-weight="700" xml:space="preserve">ALL CHECKS PASSED</text></g>
